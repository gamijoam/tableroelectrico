# Publica la carpeta app/ en la rama gh-pages (GitHub Pages) cada vez que cambia en main.
# Antes actualiza la lista de archivos que sw.js guarda para usar la app sin internet.
name: Publicar app en GitHub Pages
on:
  push:
    branches: [main]
    paths: ["app/**", "scripts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sw-files.py
      - run: touch app/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          publish_branch: gh-pages
          commit_message: "Publicar la app"
          cname: tableros.invensoft.lat
