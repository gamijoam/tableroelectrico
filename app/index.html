<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Diseña, cablea, prueba y cotiza tableros eléctricos: cajas de breakers y riel DIN con simulador, calculadora y PDF.">
<title>Taller de Tableros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1c5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tableros">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

<div class="app lib-closed side-closed" id="app">
  <header>
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="7" y="2" width="20" height="30" rx="3" fill="var(--accent)"/><rect x="12" y="9" width="10" height="13" rx="2" fill="var(--panel)"/><rect x="13.5" y="10.5" width="7" height="6" rx="1" fill="var(--fg)"/><rect x="7" y="25" width="20" height="2" fill="var(--panel)" opacity=".5"/></svg>
      <div><h1>Taller de Tableros</h1><small id="projName">Cajas de breakers y tableros sobre riel DIN</small></div>
    </div>
    <button class="icon-btn m-only" id="mUndo" aria-label="Deshacer" title="Deshacer">↶</button><button class="icon-btn m-only" id="mRedo" aria-label="Rehacer" title="Rehacer">↷</button>
    <button class="icon-btn m-only" id="mMenu" aria-label="Menú" aria-expanded="false">☰</button>
    <div class="actions">
      <select class="sel" id="tpl" aria-label="Cargar plantilla">
        <option value="">Plantillas…</option>
        <optgroup label="Caja de breakers">
          <option value="casaVE">Casa 120/240 V · 20 espacios</option>
          <option value="localVE">Local comercial 208Y/120 V · 30 espacios</option>
        </optgroup>
        <optgroup label="Riel DIN">
          <option value="supv">Supervisor de voltaje con contactor general</option>
          <option value="motor">Arranque de bomba trifásica</option>
          <option value="local">Tablero de control comercial</option>
          <option value="casa">Tablero DIN residencial</option>
        </optgroup>
      </select>
      <button class="btn" id="undo" title="Deshacer (Ctrl+Z)">Deshacer</button>
      <button class="btn" id="redo" title="Rehacer (Ctrl+Shift+Z)">Rehacer</button>
      <button class="btn" id="calc">Calculadora</button>
      <button class="btn" id="file">Proyectos</button>
      <button class="btn" id="new">Nuevo</button>
      <button class="btn" id="uni" title="Diagrama unifilar generado desde el tablero">Unifilar</button>
      <button class="btn" id="png">Exportar imagen</button>
      <button class="btn primary" id="pdf">PDF</button>
      <button class="btn" id="install" hidden>Instalar app</button>
    </div>
  </header>

  <aside id="lib">
    <button class="rail" id="libRail" aria-expanded="false" aria-controls="libList"><span>Abrir componentes</span></button>
    <div class="lib-head">
      <div class="pane-head"><span class="label" id="libTitle">Componentes</span><button class="icon-btn" id="libClose" aria-label="Guardar el panel de componentes" title="Guardar panel">«</button></div>
      <div class="cats" id="libCats" aria-label="Ir a una categoría"></div>
      <input class="txt" id="q" type="search" placeholder="Buscar…" aria-label="Buscar componentes">
    </div>
    <div class="lib-list" id="libList"></div>
  </aside>

  <section id="stagewrap">
    <div class="tools">
      <span class="seg" role="group" aria-label="Vista"><button class="segb" id="vBoard" aria-pressed="true">Tablero</button><button class="segb" id="vPanel" aria-pressed="false" title="Cablea el interior del tablero de cerca; los cables quedan hechos en la pared">Cablear<span class="d-only"> tablero</span></button><button class="segb" id="vWall" aria-pressed="false">Pared</button></span>
      <button class="btn wire-cta" id="goWire" title="Ir a la pared para tender cables y probar">Cablear y probar →</button>
      <span class="tgroup pop" id="boardTools">
      <button class="btn pop-btn" aria-expanded="false" aria-haspopup="true">Ajustes del tablero ▾</button>
      <span class="pop-body">
      <label>Tipo <select class="sel" id="kind"><option value="lc">Caja de breakers</option><option value="din">Riel DIN</option></select></label>
      <span class="tgroup" id="lcTools">
        <label>Espacios <select class="sel" id="spaces"></select></label>
        <label>Sistema <select class="sel" id="sys"><option value="1F">120/240 V monofásico</option><option value="3F">208Y/120 V trifásico</option></select></label>
        <label>Principal <select class="sel" id="main"></select></label>
      </span>
      <span class="tgroup" id="dinTools">
        <label>Filas <select class="sel" id="rows"></select></label>
        <label>Módulos por fila <select class="sel" id="mods"></select></label>
        <label>Sistema <select class="sel" id="sysD"><option value="1F">120/240 V monofásico</option><option value="3F">208Y/120 V trifásico</option></select></label>
        <label>Gabinete <select class="sel" id="style"><option value="metal">Metálico</option><option value="plastic">Plástico</option></select></label>
      </span>
      </span>
      </span>
      <span class="tgroup" id="wallTools" hidden>
        <select class="sel opt" id="wSel" aria-label="Pared activa"></select><button class="btn opt" id="wAdd" title="Agregar otra pared">+ Pared</button>
        <span class="seg" role="group" aria-label="Modo"><button class="segb" id="mMove" aria-pressed="true">Mover</button><button class="segb" id="mWire" aria-pressed="false">Cablear</button><button class="segb" id="mTube" aria-pressed="false">Tubería</button><button class="segb" id="mMeter" aria-pressed="false" title="Mide el voltaje entre dos terminales durante la prueba">Multímetro</button></span>
        <label class="opt wire-only">Cable <select class="sel" id="wColor"></select></label>
        <select class="sel opt wire-only" id="wAwg" aria-label="Calibre del cable"></select>
        <span class="pop" id="wallPop"><button class="btn pop-btn" aria-expanded="false" aria-haspopup="true">Ajustes de pared ▾</button><span class="pop-body">
        <label class="opt">Pared <select class="sel" id="wSize"></select></label>
        <label class="opt">Acabado <select class="sel" id="wFinish" aria-label="Acabado de la pared"></select></label>
        <label class="chk opt"><input type="checkbox" id="wTube"> Ver tubería</label><label class="chk opt" title="Durante la prueba, muestra por dónde circula la corriente"><input type="checkbox" id="wFlow" checked> Ver flujo de energía</label>
        </span></span>
        <button class="btn play" id="play">▶ Probar</button><button class="btn" id="rearm" hidden>Rearmar</button><button class="btn" id="blackout" hidden>Simular apagón</button>
      </span>
      <span class="chip" id="usage"></span>
      <span class="chip money" id="total" title="Total del presupuesto"></span>
      <span class="sp"></span>
      <span class="tgroup focus-only"><button class="btn" id="fUndo">Deshacer</button><button class="btn" id="fRedo">Rehacer</button><button class="btn" id="fCalc">Calculadora</button><button class="btn" id="fPng">Exportar imagen</button><button class="btn" id="fPdf">PDF</button></span>
    </div>
    <div id="stagebox"><div class="stagectl"><div class="zoom"><button class="btn" id="zout" aria-label="Alejar" title="Alejar">−</button><output id="zval">100%</output><button class="btn" id="zin" aria-label="Acercar" title="Acercar">+</button><button class="btn" id="zfit" title="Ver todo el dibujo">Ajustar</button></div><button class="btn" id="fs" aria-pressed="false" title="Pantalla completa">⛶</button></div><div id="alert" hidden></div><div id="selbar" class="selbar" hidden></div><div id="stage"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg><svg id="wall" xmlns="http://www.w3.org/2000/svg" hidden></svg></div></div>
    <div class="hint" id="hint"></div>
  </section>

  <aside id="side">
    <button class="rail" id="sideRail" aria-expanded="false" aria-controls="paneP"><span>Abrir propiedades y presupuesto</span></button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabP" aria-selected="true">Propiedades</button>
      <button class="tab" role="tab" id="tabB" aria-selected="false">Presupuesto $</button>
      <button class="icon-btn" id="sideClose" aria-label="Guardar el panel de propiedades" title="Guardar panel">»</button>
    </div>
    <div class="pane" id="paneP"></div>
    <div class="pane" id="paneB" hidden></div>
  </aside>
  <div id="sheetBg" class="m-only" aria-hidden="true"></div>
  <nav class="mnav m-only" aria-label="Navegación">
    <button id="mnLib" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M17.25 13.5v7.5M13.5 17.25H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Componentes</button>
    <button id="mnOpts" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/></svg>Ajustes</button>
    <button id="mnFit" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Ajustar</button>
    <button id="mnProps" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 12h14M5 19h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Propiedades</button>
    <button id="mnQuote" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M16.5 7.5c0-1.7-2-3-4.5-3s-4.5 1.3-4.5 3 2 2.6 4.5 3.1 4.5 1.4 4.5 3.3-2 3.1-4.5 3.1-4.5-1.3-4.5-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><b id="mnTotal">Presupuesto</b></button>
  </nav>
</div>

<div id="ghost" hidden></div>
<div id="toast" hidden></div>
<div class="modal" id="modal" hidden><div class="dlg" id="dlg"></div></div>

<script src="vendor/jspdf.umd.min.js"></script>
<!-- El orden importa: cada archivo usa lo definido en los anteriores. -->
<script src="js/util.js"></script>
<script src="js/din.js"></script>
<script src="js/loadcenter.js"></script>
<script src="js/equipment.js"></script>
<script src="js/pricing.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/panels.js"></script>
<script src="js/sim.js"></script>
<script src="js/wall.js"></script>
<script src="js/panelsrc.js"></script>
<script src="js/control.js"></script>
<script src="js/flow.js"></script>
<script src="js/routing.js"></script>
<script src="js/info.js"></script>
<script src="js/layout.js"></script>
<script src="js/selbar.js"></script>
<script src="js/projects.js"></script>
<script src="js/pdf.js"></script>
<script src="js/unifilar.js"></script>
<script src="js/share.js"></script>
<script src="js/calc.js"></script>
<script src="js/actions.js"></script>
<script src="js/touch.js"></script>
<script src="js/mobile.js"></script>
<script src="js/pwa.js"></script>
<script src="js/main.js"></script>
</body>
</html>
